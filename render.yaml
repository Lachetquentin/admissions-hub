# Render Blueprint — public demo of Admissions Hub (Salesforce disabled).
# Dashboard → New → Blueprint → this repository. See docs/DEPLOY.md.

databases:
  - name: admissions-hub-db
    plan: free
    databaseName: admissions
    user: admissions

services:
  - type: web
    name: admissions-hub-api
    runtime: docker
    plan: free
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: admissions-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SALESFORCE_ENABLED
        value: 'false'
      # Public URL of the front (static site below); set after the first deploy if it differs.
      - key: APP_URL
        value: https://admissions-hub.onrender.com

  - type: web
    name: admissions-hub
    runtime: static
    buildCommand: npm ci && npm run build --workspace @admissions-hub/web
    staticPublishPath: apps/web/dist
    routes:
      # Same-origin API calls, like nginx in docker compose.
      - type: rewrite
        source: /api/*
        destination: https://admissions-hub-api.onrender.com/api/*
      - type: rewrite
        source: /docs/*
        destination: https://admissions-hub-api.onrender.com/docs/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
